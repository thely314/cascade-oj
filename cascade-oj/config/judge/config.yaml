    driver: mysql
    source: cascade_oj:123456@tcp(cascade_mysql:3306)/cascade_oj_db?charset=utf8&parseTime=True&loc=Local
  redis:
    addr: rd:6379
    read_timeout: 0.2s
    write_timeout: 0.2s
    db: 0
  case_location:
    problem_cases_location: /cases
  judge_config:
    endpoint: localhost:5051
