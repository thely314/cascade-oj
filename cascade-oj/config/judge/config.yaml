        c++14(O2): /usr/bin/g++ -Wall -std=c++14 -o foo foo.cc -lm -O2 -I/include
        c++17: /usr/bin/g++ -Wall -std=c++17 -o foo foo.cc -lm -I/include
        c++17(O2): /usr/bin/g++ -Wall -std=c++17 -o foo foo.cc -lm -O2 -I/include
      run:
        default: foo
      source:
        default: foo
        c: foo.c
        c++11: foo.cc
        c++11(O2): foo.cc
        c++14: foo.cc
        c++14(O2): foo.cc
        c++17: foo.cc
        c++17(O2): foo.cc
      target:
        default: foo
        c: foo
        c++11: foo
        c++11(O2): foo
        c++14: foo
        c++14(O2): foo
        c++17: foo
        c++17(O2): foo
      exec_config:
        default:
          compile:
            proc_limit: 16
            cpu_time_limit: 1000
            cpu_rate_limit: 1000
            clock_time_limit: 1000
            memory_limit: 32
            stdout_max_size: 2048
            stderr_max_size: 2048
          run:
