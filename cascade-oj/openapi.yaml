components:
  schemas:
    GoogleProtobufAny:
      type: object
      properties:
        '@type':
          type: string
          description: The type of the serialized message.
      additionalProperties: true
      description: >-
        Contains an arbitrary serialized message along with a @type that
        describes the type of the serialized message.
    LoginReply:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        token:
          type: string
    LoginRequest:
      type: object
      properties:
        usernameOrEmail:
          type: string
        password:
          type: string
    LogoutReply:
      type: object
      properties:
        success:
          type: boolean
    LogoutRequest:
      type: object
      properties: {}
    SignupReply:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
    SignupRequest:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
        password:
          type: string
    Status:
      type: object
      properties:
        code:
          type: integer
          description: >-
            The status code, which should be an enum value of
            [google.rpc.Code][google.rpc.Code].
          format: int32
        message:
          type: string
          description: >-
            A developer-facing error message, which should be in English. Any
