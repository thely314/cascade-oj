syntax = "proto3";
package api.cascade.admin.v1;

option go_package = "cascade-oj/api/cascade/admin/v1;v1";

import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";
import "errors/errors.proto";

service Admin {
    rpc GetContests(GetContestsRequest) returns (GetContestsReply) {
        option (google.api.http) = {
            get: "/admin/contests"
        };
    };
    rpc GetSingleContest(GetSingleContestRequest) returns (GetSingleContestReply) {
        option (google.api.http) = {
            get: "/admin/contests/{contest_id}"
        };
    };
    rpc PostContest(PostContestRequest) returns (PostContestReply) {
        option (google.api.http) = {
            post: "/admin/contests"
            body: "*"
        };
    };
    rpc PutContest(PutContestRequest) returns (PutContestReply) {
        option (google.api.http) = {
            put: "/admin/contests/{contest_id}"
            body: "*"
        };
    };
    rpc DeleteContest(DeleteContestRequest) returns (DeleteContestReply) {
        option (google.api.http) = {
            delete: "/admin/contests/{contest_id}"
        };
    };
    rpc GetContestCompetitors(GetContestCompetitorsRequest) returns (GetContestCompetitorsReply) {
        option (google.api.http) = {
            get: "/admin/contests/{contest_id}/competitors"
        };
    };
    rpc PutContestCompetitors(PutContestCompetitorsRequest) returns (PutContestCompetitorsReply) {
        option (google.api.http) = {
            put: "/admin/contests/{contest_id}/competitors"
            body: "*"
        };
    };

    rpc GetProblems(GetProblemsRequest) returns (GetProblemsReply) {
        option (google.api.http) = {
            get: "/admin/problems"
        };
    };
    rpc GetSingleProblem(GetSingleProblemRequest) returns (GetSingleProblemReply) {
        option (google.api.http) = {
            get: "/admin/problems/{problem_id}"
        };
    };
    rpc PostProblem(PostProblemRequest) returns (PostProblemReply) {
        option (google.api.http) = {
            post: "/admin/problems"
            body: "*"
        };
    };
    rpc PutProblem(PutProblemRequest) returns (PutProblemReply) {
        option (google.api.http) = {
            put: "/admin/problems/{problem_id}"
            body: "*"
        };
    };
    rpc DeleteProblem(DeleteProblemRequest) returns (DeleteProblemReply) {
        option (google.api.http) = {
            delete: "/admin/problems/{problem_id}"
        };
    };
    rpc PublishProblem(PublishProblemRequest) returns (PublishProblemReply) {
        option (google.api.http) = {
            post: "/admin/problems/{problem_id}/publish"
            body: "*"
        };
    };

    rpc GetSubmissions(GetSubmissionsRequest) returns (GetSubmissionsReply) {
        option (google.api.http) = {
            get: "/admin/submissions"
        };
    };
    rpc GetSingleSubmission(GetSingleSubmissionRequest) returns (GetSingleSubmissionReply) {
        option (google.api.http) = {
            get: "/admin/submissions/{submission_uuid}"
        };
    };
    rpc RejudgeSubmission(RejudgeSubmissionRequest) returns (RejudgeSubmissionReply) {
        option (google.api.http) = {
            post: "/admin/submissions/{submission_uuid}/rejudge"
            body: "*"
        };
    };

    rpc GetRanks(GetRanksRequest) returns (GetRanksReply) {
        option (google.api.http) = {
            get: "/admin/{contest_id}/ranks"
        };
    };

    rpc GetAnnouncements(GetAnnouncementsRequest) returns (GetAnnouncementsReply) {
        option (google.api.http) = {
            get: "/admin/announcements"
        };
    };
    rpc PostAnnouncement(PostAnnouncementRequest) returns (PostAnnouncementReply) {
        option (google.api.http) = {
            post: "/admin/announcements"
            body: "*"
        };
    };
    rpc PutAnnouncement(PutAnnouncementRequest) returns (PutAnnouncementReply) {
        option (google.api.http) = {
            put: "/admin/announcements/{announcement_id}"
            body: "*"
        };
    };
    rpc DeleteAnnouncement(DeleteAnnouncementRequest) returns (DeleteAnnouncementReply) {
        option (google.api.http) = {
            delete: "/admin/announcements/{announcement_id}"
        };
    };

    rpc GetUsers(GetUsersRequest) returns (GetUsersReply) {
        option (google.api.http) = {
            get: "/admin/users"
        };
    };
    rpc UpdateUserInfo(UpdateUserInfoRequest) returns (UpdateUserInfoReply) {
        option (google.api.http) = {
            put: "/admin/users/{user_id}"
            body: "*"
        };
    };
    rpc DeleteUser(DeleteUserRequest) returns (DeleteUserReply) {
        option (google.api.http) = {
            delete: "/admin/users/{user_id}"
        };
    };

    rpc GetContestStatistics(GetContestStatisticsRequest) returns (GetContestStatisticsReply) {
        option (google.api.http) = {
            get: "/admin/contests/{contest_id}/statistics"
        };
    };

    rpc GetLogs(GetLogsRequest) returns (GetLogsReply) {
        option (google.api.http) = {
            get: "/admin/logs"
        };
    };
}

message ContestMetadata {
    int64 id = 1; // Contest ID
    string title = 2; // Contest Title
    google.protobuf.Timestamp start_time = 3; // Contest Start Time
    google.protobuf.Timestamp end_time = 4; // Contest End Time
    string status = 5; // Contest Status
}
message GetContestsRequest {}
message GetContestsReply {
    repeated ContestMetadata contests = 1; // List of contests metadata
}

message GetSingleContestRequest {
    int64 contest_id = 1; // Contest ID
}
message GetSingleContestReply {
    ContestMetadata metadata = 1; // Contest Metadata
    string description = 2; // Contest Description
    repeated int64 problem_ids = 3; // Problem IDs included in the contest
}

message PostContestRequest {
    string title = 1; // Contest Title
    string description = 2; // Contest Description
    google.protobuf.Timestamp start_time = 3; // Contest Start Time
    google.protobuf.Timestamp end_time = 4; // Contest End Time
    message ProblemList {
        repeated int64 problem_ids = 1; // List of Problem IDs to include in the contest
    }
    ProblemList problems = 5; // Problems included in the contest
}
message PostContestReply {
    int64 contest_id = 1; // Created Contest ID
}

message PutContestRequest {
    int64 contest_id = 1; // Contest ID
    string title = 2; // Contest Title
    string description = 3; // Contest Description
    google.protobuf.Timestamp start_time = 4; // Contest Start Time
    google.protobuf.Timestamp end_time = 5; // Contest End Time
    message ProblemList {
        repeated int64 problem_ids = 1; // List of Problem IDs to include in the contest
    }
    ProblemList problems = 6; // Problems included in the contest
}
message PutContestReply {
    bool is_updated = 1; // Whether the update was successful
}

message DeleteContestRequest {
    int64 contest_id = 1; // Contest ID
}
message DeleteContestReply {
    bool is_deleted = 1; // Whether the deletion was successful
}

message GetContestCompetitorsRequest {
    int64 contest_id = 1; // Contest ID
}
message GetContestCompetitorsReply {
    repeated UserInfo competitors = 1; // List of competitors in the contest
}
message PutContestCompetitorsRequest {
    int64 contest_id = 1; // Contest ID
    repeated int64 user_ids = 2; // List of user IDs to set as competitors
}
message PutContestCompetitorsReply {
    bool is_updated = 1; // Whether the update was successful
}

message ProblemMetadata {
    int64 id = 1; // Problem ID
    string title = 2; // Problem Title
    int32 time_limit_ms = 3; // Time Limit in milliseconds
    int32 memory_limit_mb = 4; // Memory Limit in megabytes
    string description = 5; // Problem Description
}
message GetProblemsRequest {
    int64 contest_id = 1; // Contest ID
}
message GetProblemsReply {
    repeated ProblemMetadata problems = 1; // List of problems metadata
}

message GetSingleProblemRequest {
    int64 problem_id = 1; // Problem ID
}
message GetSingleProblemReply {
    ProblemMetadata metadata = 1; // Problem Metadata
    string creator = 2; // Problem Creator
    string description = 3; // Problem Description
}

message PostProblemRequest {
    ProblemMetadata metadata = 1; // Problem Metadata
    string creator = 2; // Problem Creator
    string description = 3; // Problem Description
}
message PostProblemReply {
    int64 problem_id = 1; // Created Problem ID
}

message PutProblemRequest {
    int64 problem_id = 1; // Problem ID
    ProblemMetadata metadata = 2; // Problem Metadata
    string description = 3; // Problem Description
}
message PutProblemReply {
    bool is_updated = 1; // Whether the update was successful
}

message DeleteProblemRequest {
    int64 problem_id = 1; // Problem ID
}
message DeleteProblemReply {
    bool is_deleted = 1; // Whether the deletion was successful
}

message PublishProblemRequest {
    int64 problem_id = 1; // Problem ID
}
message PublishProblemReply {
    bool is_success = 1; // Whether the publication was successful
}

message SubmissionMetadata {
    string submission_uuid = 1; // Submission UUID
    int64 problem_id = 2; // Problem ID
    int64 user_id = 3; // User ID
    string status = 4; // Submission Status
    google.protobuf.Timestamp submit_time = 5; // Submission Time
    int32 score = 6; // Submission Score
}
message GetSubmissionsRequest {
    int64 problem_id = 1; // Problem ID
    int64 contest_id = 2; // Contest ID
    int64 user_id = 3; // User ID
    int32 page = 4; // Page number
    int32 page_size = 5; // Page size
}
message GetSubmissionsReply {
    repeated SubmissionMetadata submissions = 1; // List of submissions metadata
}

message CaseMetadata {
    int32 score = 1; // Test Case Score
    string status = 2; // Test Case Status
    int32 time_cost = 3; // Time Cost
    int32 memory_cost = 4; // Memory Cost
}
message GetSingleSubmissionRequest {
    string submission_uuid = 1; // Submission ID
}
message GetSingleSubmissionReply {
    SubmissionMetadata metadata = 1; // Submission Metadata
    string code = 2; // User Code
    string language = 3; // Programming Language
    int32 time_cost = 4; // Time Cost
    int32 memory_cost = 5; // Memory Cost
    message CaseResults {
        repeated CaseMetadata cases = 1; // List of test cases metadata
    }
    CaseResults case_results = 6; // Test Cases Results
}

message RejudgeSubmissionRequest {
    string submission_uuid = 1; // Submission UUID
}
message RejudgeSubmissionReply {
    string new_submission_uuid = 1; // New Submission UUID by rejudge
}

message GetRanksRequest {
    int64 contest_id = 1; // Contest ID
}
message GetRanksReply {
    message RankItem {
        int64 user_id = 1; // User ID
        string username = 2; // Username
        int32 rank = 3; // User Rank
        int32 score = 4; // User Score
    }
    repeated RankItem ranks = 1; // List of rank entries
}

message GetAnnouncementsRequest {}
message GetAnnouncementsReply {
    message Announcement {
        int64 id = 1; // Announcement ID
        string publisher_name = 2; // Publisher Name
        string title = 3; // Announcement Title
        string content = 4; // Announcement Content
    }
    repeated Announcement announcements = 1; // List of announcements
}

message PostAnnouncementRequest {
    string publisher_name = 1; // Publisher Name
    string title = 2; // Announcement Title
    string content = 3; // Announcement Content
}
message PostAnnouncementReply {
    int64 announcement_id = 1; // Created Announcement ID
}

message PutAnnouncementRequest {
    int64 announcement_id = 1; // Announcement ID
    string title = 2; // Announcement Title
    string content = 3; // Announcement Content
}
message PutAnnouncementReply {
    bool is_updated = 1; // Whether the update was successful
}

message DeleteAnnouncementRequest {
    int64 announcement_id = 1; // Announcement ID
}
message DeleteAnnouncementReply {
    bool is_deleted = 1; // Whether the deletion was successful
}

message UserInfo {
    int64 user_id = 1; // User ID
    string username = 2; // Username
    string email = 3; // Email
}
message GetUsersRequest {
    int32 page = 1; // Page number
    int32 page_size = 2; // Page size
}
message GetUsersReply {
    repeated UserInfo users = 1; // List of users info
}

message UpdateUserInfoRequest {
    int64 user_id = 1; // User ID
    string username = 2; // Username
    string email = 3; // Email
}
message UpdateUserInfoReply {
    bool is_updated = 1; // Whether the user info is updated
}

message DeleteUserRequest {
    int64 user_id = 1; // User ID
}
message DeleteUserReply {
    bool is_deleted = 1; // Whether the user is deleted
}

message GetContestStatisticsRequest {
    int64 contest_id = 1; // Contest ID
}
message GetContestStatisticsReply {
    // TODO
    string statistics_json = 1; // Statistics from one contest in JSON format
}

message GetLogsRequest {
    int32 page = 1; // Page number
    int32 page_size = 2; // Page size
}
message GetLogsReply {
    message LogEntry {
        int64 id = 1; // Log ID
        string message = 2; // Log Message
        google.protobuf.Timestamp timestamp = 3; // Log Timestamp
    }
    repeated LogEntry logs = 1; // List of log entries
}