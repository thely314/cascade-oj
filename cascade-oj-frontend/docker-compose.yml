services:
  cascade_nginx:
    build:
      context: ./
      dockerfile: ./Dockerfile
    image: cascade-oj/nginx:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "10086:10086"
    volumes:
      - ./nginx/logs:/var/log/nginx
    container_name: cascade_oj_nginx
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    networks:
      frontend-network:
        aliases:
          - nginx
      backend-network:
        aliases:
          - frontend-nginx

networks:
  frontend-network:
    driver: bridge

  # 连接后端服务的网络
  backend-network:
    external: true
    name: cascade-oj-backend-network
