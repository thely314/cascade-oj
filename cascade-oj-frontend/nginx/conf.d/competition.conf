# nginx/conf.d/competition.conf
server {
    # 作为默认服务器处理默认请求
    listen 80 default_server;
    server_name cascade.oj;

    # 根目录指向 competition 应用
    root /usr/share/nginx/html/competition;
    index index.html;

    # 将根 URL 内部重写到 /home/（对用户透明，不重定向）
    location = / {
        rewrite ^ /home/ last;
    }

    # 静态资源
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 缓存控制
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 50x 静态错误页面
    error_page  500 502 503 504  /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # 防止访问 admin 资源
    location ^~ /admin/ {
        deny all;
        return 403;
    }

    # API 代理
    location /api/public/ {
        proxy_pass http://host.docker.internal:8100/public/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/user/ {
        proxy_pass http://host.docker.internal:8200/user/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康检查
    location /health {
        access_log off;
        return 200 "competition ok\n";
        add_header Content-Type text/plain;
    }
}